name: Release GpxPlayerDesktop

on:
  push:
    tags:
      - 'v*' # Tags starting with 'v'
      - '[0-9]*' # Version tags without a leading 'v'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v5

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 🧰 Grant execute for gradlew (Linux only)
        if: runner.os == 'Linux'
        run: chmod +x ./gradlew

      - name: 🧪 Build project
        run: ./gradlew build

      - name: 📦 Package app
        run: ./gradlew packageReleaseDistributionForCurrentOS

      - name: 📥 Download binaries
        run: echo "Using build/compose/binaries for release"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GpxPlayerDesktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: build/compose/binaries/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
